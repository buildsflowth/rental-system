<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ระบบจัดการห้องเช่า</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%238B6A4E'/%3E%3Cpath d='M5 11.5 12 6l7 5.5M7 10.5V18h10v-7.5' fill='none' stroke='white' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#8B6A4E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="&#3627;&#3657;&#3629;&#3591;&#3648;&#3594;&#3656;&#3634;">
<script src="config.js"></script>
<script src="pwa.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF6EF; --egg:#F6EEDF; --beige:#EDE2CF; --beige-2:#DFCDAF; --brown:#8B6A4E; --brown-d:#6B4E38; --brown-dd:#3F2E22;
  --text:#3B2D23; --muted:#8E7D6D; --line:#ECE2D2; --white:#FFFFFF;
  --ok:#5F7D4E; --ok-bg:#E9EFE1; --warn:#A87628; --warn-bg:#F8ECD6; --bad:#A94F43; --bad-bg:#F6E2DD; --info:#6C7C92; --info-bg:#E8ECF1;
  --r:16px; --r-sm:10px;
  --sh:0 1px 2px rgba(80,55,30,.05),0 6px 20px rgba(80,55,30,.06);
  --side:256px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Thai',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brown-d)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.sm{font-size:13px}.xs{font-size:12px}.muted{color:var(--muted)}.r{text-align:right}.b{font-weight:600}
.hide{display:none!important}

/* ---------- layout ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--side);background:var(--white);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:50;transition:transform .25s ease}
.brand{display:flex;align-items:center;gap:12px;padding:22px 20px 18px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;border-radius:12px;background:var(--brown);color:#fff;display:grid;place-items:center;flex:none}
.logo svg.i{width:22px;height:22px}
.brand-txt{min-width:0;flex:1}
.brand-name{font-weight:600;font-size:16px;line-height:1.3;word-break:break-word}
.brand-edit{border:0;background:none;color:var(--muted);font-size:12px;padding:0;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.brand-edit svg.i{width:13px;height:13px}
.brand-edit:hover{color:var(--brown)}
.nav{padding:12px;overflow-y:auto;flex:1}
.nav-sec{font-size:11px;letter-spacing:.06em;color:var(--muted);padding:14px 12px 6px;text-transform:uppercase}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--text);text-decoration:none;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:var(--egg)}
.nav a.active{background:var(--beige);color:var(--brown-dd);font-weight:600}
.nav a.active svg.i{color:var(--brown)}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;font-size:11px;border-radius:20px;padding:0 7px;line-height:18px}
.side-foot{padding:14px 20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.overlay{position:fixed;inset:0;background:rgba(40,28,18,.35);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.show{opacity:1;pointer-events:auto}
main{margin-left:var(--side);min-height:100vh;padding-bottom:40px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:12px;padding:14px 32px;background:rgba(250,246,239,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar h1{font-size:20px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hamb{display:none}
#view{padding:26px 32px;max-width:1240px}
.demo-banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 32px 0;max-width:1176px;background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:13px}
.bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--white);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);text-decoration:none;padding:6px 0;border-radius:10px;cursor:pointer}
.bottom-nav a.active{color:var(--brown-d);font-weight:600}
.bottom-nav a.active svg.i{color:var(--brown)}

@media (max-width:1023px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.15)}
  main{margin-left:0}
  .hamb{display:inline-flex}
  .topbar{padding:12px 20px}
  #view{padding:20px}
  .demo-banner{margin:14px 20px 0}
}
@media (max-width:767px){
  .bottom-nav{display:flex}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  .topbar{padding:10px 16px}
  .topbar h1{font-size:18px}
  #view{padding:16px}
  .demo-banner{margin:12px 16px 0}
}

/* ---------- components ---------- */
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:20px}
.card h3,.sec-title{margin:0 0 14px;font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.sec-title .grow{flex:1}
.stack>*+*{margin-top:18px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.auto{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
@media (max-width:1100px){.g2{grid-template-columns:1fr}}
@media (max-width:1023px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:767px){.auto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}}

.stat{padding:18px 20px}
.stat .lbl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.stat .lbl .dot{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--egg);color:var(--brown)}
.stat .lbl .dot svg.i{width:16px;height:16px}
.stat .val{font-size:26px;font-weight:600;margin-top:8px;line-height:1.2;color:var(--brown-dd);font-variant-numeric:tabular-nums}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
@media (max-width:767px){.stat{padding:14px}.stat .val{font-size:20px}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:9px 16px;cursor:pointer;background:var(--white);border-color:var(--line);font-weight:500;white-space:nowrap;transition:background .15s,border-color .15s;min-height:40px;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--egg)}
.btn svg.i{width:18px;height:18px}
.btn-primary{background:var(--brown);border-color:var(--brown);color:#fff}
.btn-primary:hover{background:var(--brown-d)}
.btn-soft{background:var(--beige);border-color:var(--beige);color:var(--brown-dd)}
.btn-soft:hover{background:var(--beige-2)}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn-ok:hover{filter:brightness(.95);background:var(--ok)}
.btn-danger{color:var(--bad)}.btn-danger:hover{background:var(--bad-bg)}
.btn-sm{padding:5px 11px;min-height:32px;font-size:13px;border-radius:10px}
.btn-sm svg.i{width:15px;height:15px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:10px;border:1px solid transparent;background:none;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted)}
.btn-icon:hover{background:var(--egg);color:var(--brown-d)}
.btn:disabled{opacity:.55;cursor:default}
.btn-block{width:100%}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;border-radius:20px;padding:2px 10px;white-space:nowrap}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.b-ok{background:var(--ok-bg);color:var(--ok)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-info{background:var(--info-bg);color:var(--info)}
.b-muted{background:var(--egg);color:var(--muted)}
.b-brown{background:var(--beige);color:var(--brown-d)}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.toolbar .grow{flex:1}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search svg.i{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--white);border-radius:20px;padding:5px 14px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.active{background:var(--brown);border-color:var(--brown);color:#fff}
.chip .c{opacity:.7;margin-left:4px}

input,select,textarea{width:100%;border:1px solid var(--beige-2);background:var(--white);border-radius:12px;padding:9px 12px;font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s;min-height:42px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--brown);box-shadow:0 0 0 3px rgba(139,106,78,.14)}
input[readonly]{background:var(--egg)}
.field{display:block}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.field>span .req{color:var(--bad)}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid .full{grid-column:1/-1}
@media (max-width:600px){.form-grid{grid-template-columns:1fr}.form-grid.c3{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.month-nav{display:flex;align-items:center;gap:6px}
.month-nav input{width:auto;min-width:150px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{font-size:13px;color:var(--muted)}
.row .amt{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.row .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.avatar{width:42px;height:42px;border-radius:12px;background:var(--egg);color:var(--brown-d);display:grid;place-items:center;font-weight:600;flex:none}
@media (max-width:600px){.row{flex-wrap:wrap}.row .acts{width:100%;justify-content:flex-start;padding-left:56px}}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .ic{width:56px;height:56px;border-radius:18px;background:var(--egg);color:var(--brown);display:grid;place-items:center;margin:0 auto 12px}
.empty .ic svg.i{width:26px;height:26px}

/* room cards */
.room-card{background:var(--white);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--sh);display:flex;flex-direction:column;gap:8px;position:relative}
.room-card .top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.room-no{font-size:22px;font-weight:600;color:var(--brown-dd);line-height:1.1}
.room-card .meta{font-size:13px;color:var(--muted)}
.room-card .price{font-weight:600;font-variant-numeric:tabular-nums}
.room-card .tn{font-size:14px;display:flex;align-items:center;gap:6px;min-height:22px}
.room-card .acts{display:flex;gap:6px;margin-top:auto;padding-top:6px;flex-wrap:wrap}
.room-card .acts .btn{flex:1}
.room-card.st-occupied{border-top:4px solid var(--brown)}
.room-card.st-vacant{border-top:4px solid var(--ok)}
.room-card.st-reserved{border-top:4px solid var(--info)}
.room-card.st-maintenance{border-top:4px solid var(--warn)}
.room-card .bill-amt{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--brown-dd)}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.tile{border-radius:12px;padding:10px;cursor:pointer;border:1px solid var(--line);background:var(--white);text-align:left;transition:transform .1s}
.tile:hover{transform:translateY(-1px)}
.tile .no{font-weight:600;font-size:17px}
.tile .nm{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.occupied{background:var(--egg);border-color:var(--beige-2)}
.tile.vacant{background:var(--ok-bg);border-color:#D6E1C9}
.tile.reserved{background:var(--info-bg);border-color:#D3DAE4}
.tile.maintenance{background:var(--warn-bg);border-color:#EDD9B4}
.tile .bd{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:4px;vertical-align:middle}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* bill form */
.bill-info{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.bill-info>div{flex:1;min-width:100px;background:var(--egg);border-radius:12px;padding:10px 12px}
.bill-info .k{font-size:12px;color:var(--muted)}
.bill-info .v{font-weight:600}
.meter{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.meter-t{font-weight:600;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.meter-t .sw{width:10px;height:10px;border-radius:3px}
.meter-calc{font-size:13px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px}
.meter-calc b{color:var(--text)}
.sub-t{display:flex;align-items:center;justify-content:space-between;font-weight:600;font-size:14px;margin:18px 0 8px}
.ex-row{display:grid;grid-template-columns:1fr 130px 36px;gap:8px;margin-bottom:8px;align-items:center}
.bill-sum{background:var(--brown-dd);color:#fff;border-radius:14px;padding:14px 16px;margin-top:16px}
.bill-sum .ln{display:flex;justify-content:space-between;font-size:13px;opacity:.85;padding:2px 0}
.bill-sum .tt{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(255,255,255,.2);margin-top:8px;padding-top:8px;font-weight:600}
.bill-sum .tt .v{font-size:24px}
.warn-text{color:var(--bad);font-size:12px}

/* table */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
.tbl th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:600;border-top:2px solid var(--beige-2)}
.tbl .r{text-align:right}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart-legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin-bottom:6px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.hbar{margin-bottom:12px}
.hbar .top{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:5px}
.hbar .track{height:10px;background:var(--egg);border-radius:6px;overflow:hidden}
.hbar .fill{height:100%;border-radius:6px;background:var(--brown)}

/* modal */
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(40,28,18,.38)}
.modal.show{display:flex}
.modal-card{background:var(--white);border-radius:20px;width:100%;max-width:620px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(40,28,18,.25);animation:pop .18s ease}
.modal-card.lg{max-width:780px}
.modal-card.sm{max-width:420px}
.modal-head{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:17px;font-weight:600;flex:1}
.modal-body{padding:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.modal-foot:empty{display:none}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (max-width:600px){
  .modal{padding:0;align-items:flex-end}
  .modal-card,.modal-card.lg,.modal-card.sm{max-width:none;border-radius:20px 20px 0 0;max-height:94vh}
  .modal-foot{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .modal-foot .btn{flex:1}
}
#confirmBox{z-index:120}

.toast-wrap{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--brown-dd);color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:pop .2s ease}
.toast.bad{background:var(--bad)}
@media (max-width:767px){.toast-wrap{bottom:calc(90px + env(safe-area-inset-bottom))}}
.loadbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:300;overflow:hidden;display:none}
.loadbar.show{display:block}
.loadbar::after{content:"";position:absolute;height:100%;width:40%;background:var(--brown);animation:lb 1s infinite ease-in-out}
@keyframes lb{from{left:-40%}to{left:100%}}

.splash{position:fixed;inset:0;background:var(--bg);z-index:400;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted)}
.splash-err{max-width:420px;padding:0 20px;font-size:14px;color:var(--text);text-align:left}
.splash-err ul{margin:8px 0;padding-left:20px;color:var(--muted)}
.spinner{width:36px;height:36px;border:3px solid var(--beige);border-top-color:var(--brown);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lock{position:fixed;inset:0;background:var(--bg);z-index:350;display:none;align-items:center;justify-content:center;padding:20px}
.lock.show{display:flex}
.lock .card{max-width:360px;width:100%;text-align:center}
.lock input{text-align:center;font-size:22px;letter-spacing:.4em;margin:14px 0}
.pw-wrap{position:relative;display:block}
.pw-wrap input{padding-right:46px!important}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;padding:0}
.pw-eye:hover{background:var(--bg);color:var(--text)}
.lock-or{display:flex;align-items:center;gap:10px;margin:14px 0 10px;color:var(--muted);font-size:13px}
.lock-or:before,.lock-or:after{content:"";flex:1;height:1px;background:var(--line)}

/* QR / payment */
.qr-box{border:2px dashed var(--beige-2);border-radius:16px;padding:16px;text-align:center;background:var(--egg)}
.qr-box img{max-width:220px;width:100%;border-radius:10px;background:#fff;display:block;margin:0 auto 12px}
.pay-preview{display:flex;gap:16px;align-items:center;background:var(--egg);border-radius:14px;padding:14px}
.pay-preview img{width:110px;height:110px;object-fit:contain;background:#fff;border-radius:10px}

<script>
/* ตัวกันค้าง (เขียนแบบ ES5 ให้ทำงานได้แม้เบราว์เซอร์เก่า): ถ้าโหลดไม่สำเร็จ จะแสดงสาเหตุและปุ่มลองใหม่ แทนการหมุนค้าง */
(function(){
  function show(reason){
    var sp = document.getElementById('splash'); if(!sp || /\bhide\b/.test(sp.className)) return;
    document.getElementById('splashSpin').style.display = 'none';
    document.getElementById('splashMsg').innerHTML = '<b>โหลดข้อมูลไม่สำเร็จ</b>';
    var box = document.getElementById('splashErr'); box.className = 'splash-err';
    box.innerHTML = '<div>' + reason + '</div>' +
      '<ul><li>ลองเปิดลิงก์ด้วย Chrome หรือ Safari (แทนเบราว์เซอร์ในแอป LINE/Facebook)</li>' +
      '<li>อัปเดตเบราว์เซอร์ / ระบบปฏิบัติการให้เป็นเวอร์ชันล่าสุด</li>' +
      '<li>เวอร์ชันติดตั้งบน Google: ตรวจว่า Deploy เป็นเวอร์ชันล่าสุด และกดอนุญาตสิทธิ์แล้ว</li></ul>' +
      '<button onclick="location.reload()" style="margin-top:6px;padding:9px 18px;border-radius:12px;border:0;background:#8B6A4E;color:#fff;font:inherit;cursor:pointer">ลองใหม่อีกครั้ง</button>';
  }
  window.__loadFail = show;
  window.addEventListener('error', function(e){
    var msg = (e && e.message) ? String(e.message) : 'สคริปต์ทำงานผิดพลาด';
    setTimeout(function(){ show('ข้อผิดพลาด: ' + msg.replace(/[<>&]/g, '')); }, 300);
  });
  setTimeout(function(){ show('ใช้เวลาโหลดนานผิดปกติ (เกิน 25 วินาที) อาจเป็นเพราะอินเทอร์เน็ตช้าหรือเบราว์เซอร์ไม่รองรับ'); }, 25000);
})();
</script>

function bahtText(num){
  num = Math.round(n(num)*100)/100;
  const neg = num < 0; num = Math.abs(num);
  const D = ['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'], U = ['','สิบ','ร้อย','พัน','หมื่น','แสน'];
  function conv(s){
    s = String(s).replace(/^0+/,''); if(!s) return '';
    if(s.length > 6) return conv(s.slice(0,-6)) + 'ล้าน' + conv(s.slice(-6));
    let out = ''; const L = s.length;
    for(let i=0;i<L;i++){ const d = +s[i], p = L-i-1; if(!d) continue;
      if(p===1 && d===1) out += 'สิบ'; else if(p===1 && d===2) out += 'ยี่สิบ';
      else if(p===0 && d===1 && L>1) out += 'เอ็ด'; else out += D[d] + U[p]; }
    return out;
  }
  const b = Math.floor(num), st = Math.round((num-b)*100);
  let t = (b ? conv(String(b)) : 'ศูนย์') + 'บาท' + (st ? conv(String(st)) + 'สตางค์' : 'ถ้วน');
  return (neg?'ลบ':'') + t;
}

      else if(DATE.has(k)){ v = String(v || '').slice(0, 10); if(!/^\d{4}-\d{2}-\d{2}$/.test(v)) v = null; }
      else if(k === 'extras'){ v = parseExtras(v); }
      else v = v == null ? '' : String(v);
      r[snake(k)] = v;
    });
    return r;
  }
  function fromRow(row){
    const o = {};
    Object.keys(row).forEach(k => {
      if(k === 'owner_id') return;
      const v = row[k];
      o[camel(k)] = v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
    });
    return o;
  }
  async function session(){ const {data} = await client().auth.getSession(); const s = data && data.session; uid = s ? s.user.id : ''; email = s ? s.user.email : ''; return s; }
  async function need(){ if(!uid && !(await session())) throw new Error('LOCKED'); }
  async function all(t){
    let out = [], from = 0;
    for(;;){
      const rows = chk(await client().from(t).select('*').order('created_at').order('id').range(from, from + 999));
      out = out.concat(rows.map(fromRow));
      if(rows.length < 1000) return out;
      from += 1000;
    }
  }
  async function getSettings(){ const d = chk(await client().from('settings').select('data').maybeSingle()); return Object.assign({}, DEF, d ? d.data : {}); }
  async function putSettings(patch){
    const data = Object.assign(await getSettings(), patch);
    PRIVATE.forEach(k => delete data[k]);
    chk(await client().from('settings').upsert({owner_id:uid, data, updated_at:new Date().toISOString()}));
    return data;
  }
  const pub = s => Object.assign({}, s, {hasPin:false, userEmail:email});
  const own = p => !!p && String(p).indexOf(uid + '/') === 0;
  function toBlob(d){
    const m = String(d || '').match(/^data:([\w.+-]+\/[\w.+-]+);base64,(.+)$/);
    if(!m) throw new Error('ไฟล์รูปไม่ถูกต้อง');
    const bin = atob(m[2]), a = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i);
    return new Blob([a], {type:m[1]});
  }
  const extOf = t => t === 'image/png' ? 'png' : t === 'image/webp' ? 'webp' : 'jpg';
  async function upload(prefix, d){
    const b = toBlob(d), path = uid + '/' + prefix + '-' + newId() + '.' + extOf(b.type);
    chk(await client().storage.from('files').upload(path, b, {contentType:b.type, upsert:false}));
    return path;
  }
  async function remove(p){ if(own(p)) { try { await client().storage.from('files').remove([p]); } catch(e){} } }
  function readBlob(b){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); }); }
  async function download(p){
    if(!own(p)) return '';
    const {data, error} = await client().storage.from('files').download(p);
    return error || !data ? '' : readBlob(data);
  }
  async function setImage(key, prefix, d){
    await need();
    const old = (await getSettings())[key];
    const path = await upload(prefix, d);
    await putSettings({[key]:path});
    await remove(old);
    return d;
  }
  async function clearImage(key){ await need(); const old = (await getSettings())[key]; await putSettings({[key]:''}); await remove(old); return true; }
  function table(name){ if(!TBL[name]) throw new Error('ไม่รู้จักตาราง: ' + name); return TBL[name]; }
  return {
    get email(){ return email; },
    async signIn(mail, pass){ const r = await client().auth.signInWithPassword({email:mail, password:pass}); if(r.error) throw r.error; await session(); return true; },
    async signOut(){ await client().auth.signOut(); uid = ''; email = ''; },
    async changePassword(pass){ chk(await client().auth.updateUser({password:pass})); return true; },
    async apiGetAll(){
      if(!(await session())) return {locked:true, systemName:''};
      const [prof, cfg] = await Promise.all([
        client().from('profiles').select('*').maybeSingle(),
        client().from('app_config').select('key,value')
      ]);
      const account = chk(prof), contact = ((chk(cfg) || []).find(c => c.key === 'contact') || {}).value || '';
      const today = todayStr();
      const reason = !account ? 'missing' : !account.active ? 'suspended'
        : (!account.is_admin && account.expires_at && account.expires_at < today) ? 'expired' : '';
      if(reason) return {expired:true, reason, account, contact, email};
      const [s, rooms, tenants, bills, expenses, repairs] = await Promise.all([getSettings(), all('rooms'), all('tenants'), all('bills'), all('expenses'), all('repairs')]);
      const p = pub(s);
      [p.qrImage, p.signImage] = await Promise.all([download(s.qrPath), download(s.signPath)]);
      return {settings:p, rooms, tenants, bills, expenses, repairs, account, contact};
    },
    async admin(action, data){
      await need();
      const {data:res, error} = await client().functions.invoke('admin-users', {body:Object.assign({action}, data || {})});
      if(error){
        let m = error.message || String(error);
        try { const j = await error.context.json(); if(j && j.error) m = j.error; } catch(e){}
        throw new Error(m);
      }
      if(res && res.error) throw new Error(res.error);
      return res;
    },
    async apiSave(pin, name, obj){
      await need(); const t = table(name);
      obj = Object.assign({}, obj); if(!obj.id) obj.id = newId();
      return fromRow(chk(await client().from(t).upsert(toRow(name, obj)).select().single()));
    },
    async apiSaveMany(pin, name, list){
      await need(); const t = table(name);
      const rows = (list || []).map(o => { o = Object.assign({}, o); if(!o.id) o.id = newId(); return toRow(name, o); });
      if(!rows.length) return [];
      return chk(await client().from(t).upsert(rows, {defaultToNull:false}).select()).map(fromRow);
    },
    async apiDelete(pin, name, id){ await need(); chk(await client().from(table(name)).delete().eq('id', id)); return true; },
    async apiSaveSettings(pin, obj){ await need(); obj = Object.assign({}, obj); delete obj.qrPath; delete obj.signPath; return pub(await putSettings(obj)); },
    apiUploadQR(pin, d){ return setImage('qrPath', 'payment-qr', d); },
    apiRemoveQR(){ return clearImage('qrPath'); },
    apiUploadSign(pin, d){ return setImage('signPath', 'signature', d); },
    apiRemoveSign(){ return clearImage('signPath'); },
    async apiUploadPhoto(pin, d, name, oldId){ await need(); const p = await upload('meter/' + String(name || 'meter').replace(/[^\w-]/g, ''), d); await remove(oldId); return p; },
    async apiGetImage(pin, p){ await need(); return download(p); },
    async apiDeletePhoto(pin, p){ await need(); await remove(p); return true; }
  };
})();

// บิลก่อนหน้า (ใช้ดึงเลขมิเตอร์) — บิลแรกเข้าในเดือนเดียวกันนับเป็น "ก่อนหน้า" ของบิลรายเดือน
const meterKey = b => b.month + (isMI(b) ? '0' : '1');
const beforeMonth = (b, m) => isMI(b) ? b.month <= m : b.month < m;
const lastBillBefore = (roomId, m) => DB.bills.filter(b => b.roomId === roomId && beforeMonth(b, m)).sort((a,b) => meterKey(b).localeCompare(meterKey(a)))[0];
const billLabel = b => isMI(b) ? 'บิลแรกเข้า · ' + dateTH(b.moveInDate || b.dueDate) : monthTH(b.month);
const billIncome = b => n(b.total) - n(b.deposit);   // ไม่นับเงินประกันเป็นรายได้
const roomLabel = id => { const r = roomById(id); return r ? 'ห้อง ' + r.number : '-'; };
function billState(b){
  if(!b) return {k:'none', label:'ยังไม่ออกบิล', cls:'b-muted'};
  if(b.status === 'paid') return {k:'paid', label:'ชำระแล้ว', cls:'b-ok'};
  if(b.dueDate && b.dueDate < todayStr()) return {k:'overdue', label:'เกินกำหนด', cls:'b-bad'};
  return {k:'unpaid', label:'รอชำระ', cls:'b-warn'};
}
function calcBill(b, s){
  s = s || S();
  const flat = b.waterMode === 'flat';
  const wu = flat ? 0 : Math.max(0, n(b.waterCurr) - n(b.waterPrev));
  let wa = flat ? n(b.waterFlat) : wu * n(b.waterRate), wMin = false;
  if(!flat && n(s.waterMin) > 0 && wa < n(s.waterMin) && (b.waterCurr !== '' && b.waterCurr != null)) { wa = n(s.waterMin); wMin = true; }
  const eu = Math.max(0, n(b.elecCurr) - n(b.elecPrev));
  const ea = eu * n(b.elecRate);
  const ext = sum(parseExtras(b.extras), 'amount');
  const total = Math.round((n(b.rent) + wa + ea + ext - n(b.discount)) * 100) / 100;
  return {wu, wa, wMin, eu, ea, ext, total};
}
function defaultDue(m){ const d = Math.min(28, Math.max(1, n(S().dueDay) || 5)); return addMonth(m, 1) + '-' + pad(d); }

/* ---------- รูปมิเตอร์ ---------- */
// PH = สถานะรูปในฟอร์มที่เปิดอยู่: {water:{orig, pending, removed}, elec:{...}}
let PH = {water:{}, elec:{}};
const PHOTO_CACHE = {};
const PH_LABEL = {water:'มิเตอร์น้ำ', elec:'มิเตอร์ไฟ'};
function initPhotos(b){ PH = {water:{orig:(b && b.waterPhoto) || ''}, elec:{orig:(b && b.elecPhoto) || ''}}; }
function getPhoto(v){
  if(!v) return Promise.resolve('');
  if(String(v).startsWith('data:')) return Promise.resolve(v);
  if(!PHOTO_CACHE[v]) PHOTO_CACHE[v] = api('GetImage', v).catch(() => { delete PHOTO_CACHE[v]; return ''; });
  return PHOTO_CACHE[v];
}
function hydratePhotos(root){
  return Promise.all(Array.from((root || document).querySelectorAll('img[data-photo]')).map(img => {
    if(img.getAttribute('src')) return Promise.resolve();
    return getPhoto(img.dataset.photo).then(src => { if(src){ img.src = src; return img.decode ? img.decode().catch(()=>{}) : null; } img.classList.add('ph-missing'); });
  }));
}
function photoSlot(k){
  const p = PH[k], cur = p.pending || (p.removed ? '' : p.orig);
  if(cur) return `<div class="ph"><img ${cur.startsWith('data:') ? `src="${cur}"` : `data-photo="${esc(cur)}"`} alt="${PH_LABEL[k]}" onclick="viewPhoto(this.src)">
    <button type="button" class="ph-del" title="ลบรูป" onclick="removePhoto('${k}')">${ic('x')}</button><span class="ph-cap">${PH_LABEL[k]}</span></div>`;
  return `<label class="ph-add"><input type="file" accept="image/&#42;" class="hide" onchange="pickPhoto('${k}', this)">${ic('camera')}<span>แนบรูป${PH_LABEL[k]}</span></label>`;
}
const photoBox = k => `<div class="ph-wrap" id="ph-${k}">${photoSlot(k)}</div>`;
function redrawPhoto(k){ const el = $('#ph-' + k); if(el){ el.innerHTML = photoSlot(k); hydratePhotos(el); } }
async function pickPhoto(k, input){
  const f = input.files && input.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)) return toast('กรุณาเลือกไฟล์รูปภาพ', 'bad');
  try { PH[k].pending = await resizeJPEG(f, 1280, .72); PH[k].removed = false; redrawPhoto(k); }
  catch(e){ toast('อ่านรูปไม่สำเร็จ', 'bad'); }
}
function removePhoto(k){ PH[k].pending = null; PH[k].removed = true; redrawPhoto(k); }
function resizeJPEG(file, max, q){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej;
      img.onload = () => { const s = Math.min(1, max/Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); const x = c.getContext('2d');
        x.fillStyle = '#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(img, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); };
      img.src = fr.result; };
    fr.readAsDataURL(file); });
}
// อัปโหลดรูปที่เลือกใหม่ / ลบรูปที่เอาออก แล้วคืนค่าที่จะเก็บในบิล
async function commitPhoto(k, skip, name){
  const p = PH[k], old = p.orig || '';
  const drop = () => { if(old && !old.startsWith('data:')) api('DeletePhoto', old).catch(()=>{}); };
  if(skip){ drop(); return ''; }
  if(p.pending){ const id = await call('UploadPhoto', p.pending, name + '-' + k, old.startsWith('data:') ? '' : old); PHOTO_CACHE[id] = Promise.resolve(p.pending); return id; }
  if(p.removed){ drop(); return ''; }
  return old;
}

    const other = tenantOf(o.roomId); if(other && other.id !== id) return toast('ห้องนี้มีผู้เช่าแล้ว', 'bad');

function niceMax(v){ if(v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))); const f = v / p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10) * p; }
function barChart(data){
  const W = 760, H = 270, pl = 46, pr = 8, pt = 14, pb = 30, ih = H-pt-pb;
  const max = niceMax(Math.max(...data.map(d => Math.max(d.billed, d.exp)))), cw = (W-pl-pr)/data.length, bw = Math.min(18, cw*0.3);
  const y = v => pt + ih - (v/max)*ih;
  let g = '';
  for(let i=0;i<=4;i++){ const v = max*i/4, yy = y(v); g += `<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="#EFE6D7" stroke-width="1"/><text x="${pl-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="#9A8A7A">${shortNum(v)}</text>`; }
  data.forEach((d,i) => {
    const cx = pl + i*cw + cw/2, x1 = cx - bw - 2, x2 = cx + 2;
    const hR = d.recv/max*ih, hO = d.out/max*ih, hE = d.exp/max*ih;
    g += `<g><title>${TH_M[i]}\nรับแล้ว ${fmt(d.recv)}\nค้างชำระ ${fmt(d.out)}\nรายจ่าย ${fmt(d.exp)}</title>`;
    if(hO > 0) g += `<rect x="${x1}" y="${y(d.recv+d.out)}" width="${bw}" height="${hO}" rx="3" fill="#DFCDAF"/>`;
    if(hR > 0) g += `<rect x="${x1}" y="${y(d.recv)}" width="${bw}" height="${hR}" rx="3" fill="#8B6A4E"/>`;
    if(hE > 0) g += `<rect x="${x2}" y="${y(d.exp)}" width="${bw}" height="${hE}" rx="3" fill="#C9A27A" opacity=".55"/>`;
    g += `<rect x="${pl+i*cw}" y="${pt}" width="${cw}" height="${ih}" fill="transparent"/></g>`;
    g += `<text x="${cx}" y="${H-10}" text-anchor="middle" font-size="11.5" fill="#8E7D6D">${TH_MS[i]}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟรายรับรายจ่ายรายเดือน" font-family="IBM Plex Sans Thai, sans-serif">${g}</svg>`;
}
function downloadCSV(name, rows){
  if(HOSTED) return toast('การส่งออกไฟล์ใช้ได้ในเวอร์ชันติดตั้งจริง');
  const csv = '﻿' + rows.map(r => r.map(c => { const s = String(c==null?'':c); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; }).join(',')).join('\n');
  const url = URL.createObjectURL(new Blob([csv], {type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function exportReport(){

}

function setupPad(){
  const cv = $('#signPad'), wrap = $('#padWrap'); if(!cv) return;
  const dpr = Math.max(1, window.devicePixelRatio || 1), w = wrap.clientWidth, h = 220;
  cv.width = w * dpr; cv.height = h * dpr; cv.style.width = w + 'px'; cv.style.height = h + 'px';
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr); ctx.lineCap = ctx.lineJoin = 'round';
  PAD = {cv, ctx, color:'#1F2A5A', down:false, dirty:false, last:null};
  const pos = e => { const r = cv.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top, p:e.pressure || .5}; };
  cv.onpointerdown = e => { e.preventDefault(); cv.setPointerCapture(e.pointerId); PAD.down = true; PAD.last = pos(e); PAD.mid = PAD.last;
    ctx.fillStyle = PAD.color; ctx.beginPath(); ctx.arc(PAD.last.x, PAD.last.y, 1.4, 0, Math.PI*2); ctx.fill(); PAD.dirty = true; $('#padWrap').classList.add('used'); };
  cv.onpointermove = e => { if(!PAD.down) return; e.preventDefault(); const p = pos(e), l = PAD.last;
    const mid = {x:(l.x+p.x)/2, y:(l.y+p.y)/2};
    ctx.strokeStyle = PAD.color; ctx.lineWidth = e.pointerType === 'pen' ? 1.4 + p.p*2.4 : 2.6;
    ctx.beginPath(); ctx.moveTo(PAD.mid.x, PAD.mid.y); ctx.quadraticCurveTo(l.x, l.y, mid.x, mid.y); ctx.stroke();
    PAD.last = p; PAD.mid = mid; };
  cv.onpointerup = cv.onpointercancel = () => { PAD.down = false; };
}

// ตัดขอบว่างรอบลายเซ็น และย่อให้กว้างไม่เกิน maxW
function trimCanvas(src, maxW=600){
  const ctx = src.getContext('2d'), {width:w, height:h} = src, d = ctx.getImageData(0, 0, w, h).data;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){ if(d[(y*w+x)*4+3] > 10){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; } }
  if(x1 < 0) return null;
  const p = Math.round(Math.max(w,h) * 0.02), sx = Math.max(0,x0-p), sy = Math.max(0,y0-p), sw = Math.min(w,x1+p) - sx, sh = Math.min(h,y1+p) - sy;
  const k = Math.min(1, maxW / sw), out = document.createElement('canvas');
  out.width = Math.round(sw*k); out.height = Math.round(sh*k);
  out.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, out.width, out.height);
  return out.toDataURL('image/png');
}

function signFromFile(file){
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej;
    fr.onload = () => { const img = new Image(); img.onerror = rej;
      img.onload = () => { const s = Math.min(1, 1000/Math.max(img.width, img.height)), c = document.createElement('canvas');
        c.width = Math.round(img.width*s); c.height = Math.round(img.height*s); const x = c.getContext('2d'); x.drawImage(img, 0, 0, c.width, c.height);
        // ลบพื้นหลังสีขาว/สว่าง ให้โปร่งใส
        const id = x.getImageData(0, 0, c.width, c.height), d = id.data;
        for(let i=0;i<d.length;i+=4){ const l = .299*d[i] + .587*d[i+1] + .114*d[i+2];
          if(l > 200) d[i+3] = 0; else if(l > 140) d[i+3] = Math.round(d[i+3] * (200-l)/60); }
        x.putImageData(id, 0, 0); res(trimCanvas(c)); };
      img.src = fr.result; };
    fr.readAsDataURL(file); });
}

async function unlock(){
  if(IS_SUPA){
    const mail = $('#loginEmail').value.trim(), pass = $('#loginPass').value;
    if(!mail || !pass) return toast('กรุณากรอกอีเมลและรหัสผ่าน', 'bad');
    busy(true);
    try { await Supa.signIn(mail, pass); $('#loginPass').value = ''; }
    catch(e){ toast(/invalid/i.test((e && e.message) || '') ? 'อีเมลหรือรหัสผ่านไม่ถูกต้อง' : 'เข้าสู่ระบบไม่สำเร็จ: ' + ((e && e.message) || e), 'bad'); return; }
    finally { busy(false); }
    return load();
  }
  PIN = $('#pinInput').value.trim(); try { sessionStorage.setItem('rent_pin', PIN); } catch(e){} $('#pinInput').value = ''; load();
}

async function savePassword(){
  const o = formObj($('#pwForm'));
  if(String(o.p1 || '').length < 8) return toast('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร', 'bad');
  if(o.p1 !== o.p2) return toast('รหัสผ่านไม่ตรงกัน', 'bad');

  catch(e){ toast('เปลี่ยนรหัสผ่านไม่สำเร็จ: ' + ((e && e.message) || e), 'bad'); }

function syncAccountUI(){

  if(isAdmin() && i < 0) PAGES.push({id:'admin', label:'จัดการลูกค้า', icon:'users', sec:'ผู้ดูแลระบบ'});
  if(!isAdmin() && i > -1){ PAGES.splice(i, 1); if(cur === 'admin') cur = 'dashboard'; }
  const bn = $('#demoBanner'), a = DB.account;
  if(IS_GAS){

      bn.innerHTML = `<div style="flex:1;min-width:200px"><b>ยังไม่ได้ตั้ง PIN</b> — ใครที่มีลิงก์นี้จะเปิดระบบได้ทันที แนะนำให้ตั้ง PIN ก่อนใช้งานจริง</div><button class="btn btn-sm btn-primary" onclick="setPin()">${ic('lock')}ตั้ง PIN</button>`;

const addMonths = (d, m) => { const x = new Date(d + 'T00:00:00'); const day = x.getDate(); x.setMonth(x.getMonth() + m); if(x.getDate() !== day) x.setDate(0); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); };
const addDays = (d, n2) => { const x = new Date(d + 'T00:00:00'); x.setDate(x.getDate() + n2); return x.getFullYear() + '-' + pad(x.getMonth() + 1) + '-' + pad(x.getDate()); };
function genPassword(){
  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  const a = new Uint32Array(10); crypto.getRandomValues(a);
  return Array.from(a, v => cs[v % cs.length]).join('');
}
const AD = {users:[], me:'', config:{}, q:'', tab:'all', loaded:false};
function accState(u){
  if(u.is_admin) return {k:'admin', label:'ผู้ดูแลระบบ', cls:'b-brown'};
  if(!u.active) return {k:'suspended', label:'ระงับ', cls:'b-muted'};
  if(!u.expires_at) return {k:'active', label:'ไม่มีวันหมดอายุ', cls:'b-ok'};
  const d = daysUntil(u.expires_at);
  if(d < 0) return {k:'expired', label:'หมดอายุ', cls:'b-bad'};
  if(d <= 7) return {k:'soon', label:'เหลือ ' + d + ' วัน', cls:'b-warn'};
  return {k:'active', label:'ใช้งานอยู่', cls:'b-ok'};
}

async function call2(fn){ busy(true); try { return await fn(); } finally { busy(false); } }

          : field('อีเมล (ใช้เข้าระบบ) <span class="req">*</span>', '<input name="email" type="email" autocomplete="off" required>', 'full') +
            field('รหัสผ่าน <span class="req">*</span>', `<div style="display:flex;gap:8px"><input name="password" id="cfPw" autocomplete="new-password" value="${genPassword()}" style="flex:1"><button type="button" class="btn" onclick="$('#cfPw').value=genPassword()">สุ่มใหม่</button></div><div class="hint">อย่างน้อย 8 ตัว — ส่งให้ลูกค้าหลังสร้างบัญชี</div>`, 'full')}
      ${field('ชื่อลูกค้า / ชื่อหอพัก', `<input name="displayName" value="${esc(u ? u.display_name : '')}">`)}
      ${field('เบอร์โทร', `<input name="phone" type="tel" value="${esc(u ? u.phone : '')}">`)}
      ${u ? '' : field('แพ็กเกจ', `<select name="plan" onchange="$('#cfExp').value=planDate(this.value, todayStr())">${PLANS.map(([k,l]) => `<option value="${k}" ${k==='1'?'selected':''}>${l}</option>`).join('')}</select>`) +
        field('ใช้ได้ถึงวันที่', `<input name="expiresAt" id="cfExp" type="date" value="${planDate('1', todayStr())}"><div class="hint">เว้นว่าง = ไม่มีวันหมดอายุ</div>`)}
      ${field('หมายเหตุ', `<input name="note" value="${esc(u ? u.note : '')}" placeholder="เช่น ชำระแล้ว 1,500 บาท">`, 'full')}
    </form>`,
    foot:`<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="cfSave" onclick="saveCustomer('${u ? u.user_id : ''}')">${ic('check')}${u ? 'บันทึก' : 'สร้างบัญชี'}</button>`});
}
async function saveCustomer(id){
  const o = formObj($('#custForm'));
  if(!id){
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(o.email || '')) return toast('กรุณากรอกอีเมลให้ถูกต้อง', 'bad');
    if(String(o.password || '').length < 8) return toast('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร', 'bad');
  }
  $('#cfSave').disabled = true;
  try {
    if(id) await call2(() => Supa.admin('update', {userId:id, displayName:o.displayName, phone:o.phone, note:o.note}));
    else await call2(() => Supa.admin('create', {email:o.email, password:o.password, displayName:o.displayName, phone:o.phone, note:o.note, expiresAt:o.expiresAt}));
    await loadAdmin();
    if(id){ toast('บันทึกแล้ว'); closeModal(); }
    else showCredentials(o.email, o.password, o.expiresAt);
  } catch(e){ toast(e.message || String(e), 'bad'); $('#cfSave').disabled = false; }
}
function credText(email, pw, exp){
  const link = location.href.split('#')[0].split('?')[0];
  return `ระบบ: ${S().systemName || 'ระบบจัดการห้องเช่า'}\nลิงก์เข้าใช้งาน: ${link}\nอีเมล: ${email}\nรหัสผ่าน: ${pw}\n${exp ? 'ใช้งานได้ถึง: ' + dateTH(exp) : 'ไม่มีวันหมดอายุ'}\n(แนะนำให้เปลี่ยนรหัสผ่านที่เมนู ตั้งค่าระบบ → บัญชีผู้ใช้)`;
}
function showCredentials(email, pw, exp){
  const t = credText(email, pw, exp);
  openModal({title:'สร้างบัญชีเรียบร้อย', size:'sm',
    body:`<p class="sm muted" style="margin-top:0">ส่งข้อมูลนี้ให้ลูกค้า (รหัสผ่านจะไม่แสดงอีก)</p>
      <textarea id="credBox" rows="7" readonly style="font-size:14px">${esc(t)}</textarea>`,
    foot:`<button class="btn" onclick="closeModal()">ปิด</button><button class="btn btn-primary" onclick="copyText($('#credBox').value)">คัดลอกข้อความ</button>`});
}
async function copyText(t){
  try { await navigator.clipboard.writeText(t); toast('คัดลอกแล้ว'); }
  catch(e){ const el = $('#credBox'); if(el){ el.select(); document.execCommand('copy'); toast('คัดลอกแล้ว'); } }
}
function openRenew(id){
  const u = AD.users.find(x => x.user_id === id); if(!u) return;
  const base = u.expires_at && u.expires_at >= todayStr() ? u.expires_at : todayStr();
  openModal({title:'ต่ออายุ · ' + (u.display_name || u.email), size:'sm',
    body:`<p class="sm muted" style="margin-top:0">ปัจจุบัน: ${u.expires_at ? 'ใช้ได้ถึง ' + dateTH(u.expires_at) : 'ไม่มีวันหมดอายุ'} — ต่อจาก ${dateTH(base)}</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${[['1','+1 เดือน'],['3','+3 เดือน'],['6','+6 เดือน'],['12','+1 ปี']].map(([m,l]) => `<button class="btn btn-sm" onclick="$('#rnDate').value=addMonths('${base}',${m})">${l}</button>`).join('')}</div>
      ${field('ใช้ได้ถึงวันที่', `<input id="rnDate" type="date" value="${addMonths(base, 1)}"><div class="hint">เว้นว่าง = ไม่มีวันหมดอายุ</div>`)}`,
    foot:`<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="rnSave" onclick="saveRenew('${id}')">${ic('check')}บันทึก</button>`});
}
async function saveRenew(id){
  $('#rnSave').disabled = true;
  try { await call2(() => Supa.admin('update', {userId:id, expiresAt:$('#rnDate').value, active:true})); toast('ต่ออายุแล้ว'); closeModal(); await loadAdmin(); }
  catch(e){ toast(e.message || String(e), 'bad'); $('#rnSave').disabled = false; }
}
function openResetPw(id){
  const u = AD.users.find(x => x.user_id === id); if(!u) return;
  openModal({title:'ตั้งรหัสผ่านใหม่ · ' + (u.display_name || u.email), size:'sm',
    body:field('รหัสผ่านใหม่', `<div style="display:flex;gap:8px"><input id="rpPw" autocomplete="new-password" value="${genPassword()}" style="flex:1"><button type="button" class="btn" onclick="$('#rpPw').value=genPassword()">สุ่มใหม่</button></div><div class="hint">อย่างน้อย 8 ตัว</div>`),
    foot:`<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="rpSave" onclick="saveResetPw('${id}')">${ic('check')}บันทึก</button>`});
}
async function saveResetPw(id){
  const pw = $('#rpPw').value, u = AD.users.find(x => x.user_id === id);
  if(pw.length < 8) return toast('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร', 'bad');
  $('#rpSave').disabled = true;
  try { await call2(() => Supa.admin('password', {userId:id, password:pw})); showCredentials(u.email, pw, u.is_admin ? '' : u.expires_at); }
  catch(e){ toast(e.message || String(e), 'bad'); $('#rpSave').disabled = false; }
}
async function toggleActive(id){
  const u = AD.users.find(x => x.user_id === id); if(!u) return;
  if(u.active && !await confirmBox(`ระงับบัญชี <b>${esc(u.email)}</b>? ลูกค้าจะเข้าใช้งานไม่ได้จนกว่าจะเปิดใช้อีกครั้ง (ข้อมูลไม่หาย)`, {yes:'ระงับ', danger:true})) return;
  try { await call2(() => Supa.admin('update', {userId:id, active:!u.active})); toast(u.active ? 'ระงับบัญชีแล้ว' : 'เปิดใช้บัญชีแล้ว'); await loadAdmin(); }
  catch(e){ toast(e.message || String(e), 'bad'); }
}
async function deleteCustomer(id){
  const u = AD.users.find(x => x.user_id === id); if(!u) return;
  if(!await confirmBox(`ลบบัญชี <b>${esc(u.email)}</b> ถาวร?<br><br>ข้อมูลหอพักทั้งหมดของลูกค้ารายนี้ (ห้อง ผู้เช่า บิล รูปภาพ) จะถูกลบและ<b>กู้คืนไม่ได้</b><br>หากแค่หยุดให้ใช้งาน แนะนำให้กด "ระงับ" แทน`, {title:'ลบบัญชีถาวร', yes:'ลบถาวร', danger:true})) return;
  try { await call2(() => Supa.admin('delete', {userId:id})); toast('ลบบัญชีแล้ว'); await loadAdmin(); }
  catch(e){ toast(e.message || String(e), 'bad'); }
}
async function saveContact(){
  $('#adContactBtn').disabled = true;
  try { const v = $('#adContact').value; await call2(() => Supa.admin('config', {contact:v})); AD.config.contact = v; toast('บันทึกช่องทางติดต่อแล้ว'); }
  catch(e){ toast(e.message || String(e), 'bad'); }
  finally { $('#adContactBtn').disabled = false; }
}
async function reload(){ await load(true); toast('โหลดข้อมูลล่าสุดแล้ว'); }
async function load(quiet){
  if(IS_SUPA && /ใส่/.test(SUPA_CFG.url + SUPA_CFG.key)){
    $('#splash').classList.add('hide');
    $('#view').innerHTML = `<div class="card">${emptyBox('settings', 'ยังไม่ได้ตั้งค่าการเชื่อมต่อฐานข้อมูล: แก้ไฟล์ config.js ใส่ Project URL และ Publishable key ของ Supabase ตามคู่มือ')}</div>`;
    return;
  }
  busy(true);
  try {
    const d = await api('GetAll');
    if(d.locked){ if(d.wait) toast('ใส่ PIN ผิดหลายครั้ง กรุณารอ 15 นาทีแล้วลองใหม่', 'bad'); else if($('#lock').classList.contains('show') && !IS_SUPA) toast('PIN ไม่ถูกต้อง', 'bad'); showLock(d.systemName); return; }
    if(d.expired) return showExpired(d);
    $('#lock').classList.remove('show');
    DB = {settings:d.settings||{}, rooms:d.rooms||[], tenants:d.tenants||[], bills:d.bills||[], expenses:d.expenses||[], repairs:d.repairs||[], account:d.account||null, contact:d.contact||''};
    syncAccountUI();
    applyBrand(); render();
  } catch(e){
    $('#view').innerHTML = `<div class="card">${emptyBox('alert', 'โหลดข้อมูลไม่สำเร็จ: ' + esc((e && e.message) || e), `<button class="btn btn-primary" onclick="load()">ลองอีกครั้ง</button>`)}</div>`;
  } finally { busy(false); $('#splash').classList.add('hide'); }
}
document.addEventListener('keydown', e => { if(e.key === 'Escape'){ if($('#lightbox').classList.contains('show')) return closePhoto(); if($('#confirmBox').classList.contains('show')) $('#cfNo').click(); else closeModal(); } });
function startDemo(){ location.href = location.pathname + '?demo=1'; }
function exitDemo(){ location.href = location.pathname; }
/* ---------- ปุ่มแสดง/ซ่อนรหัสผ่าน: ใส่ให้ทุกช่องรหัสผ่านอัตโนมัติ ---------- */
const EYE_ON = '<svg class="i" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYE_OFF = '<svg class="i" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
function addEyes(root){
  (root || document).querySelectorAll('input[type="password"]:not([data-eye])').forEach(inp => {
    inp.dataset.eye = '1';
    const wrap = document.createElement('span'); wrap.className = 'pw-wrap';
    const cs = getComputedStyle(inp); wrap.style.margin = cs.margin; inp.style.margin = '0';
    inp.parentNode.insertBefore(wrap, inp); wrap.appendChild(inp);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'pw-eye'; b.innerHTML = EYE_ON; b.setAttribute('aria-label', 'แสดงรหัสผ่าน'); b.title = 'แสดงรหัสผ่าน';
    wrap.appendChild(b);
  });
}
document.addEventListener('mousedown', e => { if(e.target.closest && e.target.closest('.pw-eye')) e.preventDefault(); });
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.pw-eye'); if(!b) return;
  const inp = b.parentNode.querySelector('input'); if(!inp) return;
  const show = inp.type === 'password'; inp.type = show ? 'text' : 'password';
  b.innerHTML = show ? EYE_OFF : EYE_ON; const t = show ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'; b.title = t; b.setAttribute('aria-label', t); inp.focus();
});
new MutationObserver(() => addEyes()).observe(document.body, {childList:true, subtree:true});
addEyes();
(function init(){
  if(!LIVE) $('#demoBanner').classList.remove('hide');
  if(DEMO && SUPA_CFG){
    $('#demoBanner').insertAdjacentHTML('beforeend', `<button class="btn btn-sm btn-primary" onclick="exitDemo()">${ic('lock')}เข้าสู่ระบบจริง</button>`);
    let seen = false; try { seen = !!localStorage.getItem('rent_intro'); } catch(e){}
    if(!seen && typeof showIntro === 'function') setTimeout(showIntro, 700);
  }
  if(HOSTED){ let seen = false; try { seen = !!localStorage.getItem('rent_intro'); } catch(e){}
    if(!seen) setTimeout(showIntro, 700); }
  try { const p = localStorage.getItem('rent_page'); if(p && PAGES.some(x => x.id === p)) cur = p; } catch(e){}
  load();
})();
</script>
